name: artifact-verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release manifest
        run: python -m stage_xray_artifact verify-manifest
      - name: Scan publication boundary
        run: python -m stage_xray_artifact privacy-scan
      - name: Reproduce paper-linked results
        run: python -m stage_xray_artifact reproduce --data data/publication_safe --out build/ci --verify
      - name: Run tests
        run: python -m unittest discover -s tests -v
