[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-xray-artifact"
version = "4.0.0"
description = "Publication-safe reproduction artifact for validated structural comparison of OpenUSD Stages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "KangRyeol Kim"},
  {name = "JongWon Kim"},
]
keywords = ["OpenUSD", "HPC", "digital twin", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/KappyDays/stage-xray-artifact"

[project.scripts]
stage-xray-artifact = "stage_xray_artifact.__main__:main"

[tool.setuptools]
packages = ["stage_xray_artifact"]
